ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

if (project == rootProject) {
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath("com.android.tools.build:gradle:8.10.2")
        }
    }
}

def resolveReactNativeDir() {
    def fromExt = safeExtGet("REACT_NATIVE_NODE_MODULES_DIR", null)
    if (fromExt != null) {
        return file(fromExt)
    }
    def sibling = file("$projectDir/../../react-native")
    if (sibling.exists()) {
        return sibling
    }
    def hoisted = file("$projectDir/../node_modules/react-native")
    if (hoisted.exists()) {
        return hoisted
    }
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            workingDir(rootProject.projectDir)
            commandLine("node", "--print", "require.resolve('react-native/package.json')")
            standardOutput = stdout
        }
        def pkg = stdout.toString().trim()
        if (pkg.length() > 0) {
            def fromNode = file(pkg).parentFile
            if (fromNode.exists()) {
                return fromNode
            }
        }
    } catch (Exception ignored) {
    }
    throw new GradleException(
            "${project.name}: Cannot resolve react-native. Install dependencies and ensure react-native is hoisted or set REACT_NATIVE_NODE_MODULES_DIR.")
}

apply plugin: "com.android.library"

def reactNativeDir = resolveReactNativeDir()

android {
    namespace "com.dylanvann.fastimage"
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    buildToolsVersion safeExtGet("buildToolsVersion", "36.0.0")

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 36)
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    sourceSets {
        main {
            java {
                if (safeExtGet("excludeAppGlideModule", false)) {
                    srcDir "src"
                    exclude "**/FastImageGlideModule.java"
                }
            }
        }
    }

    lint {
        abortOnError false
    }
}

repositories {
    maven { url "$reactNativeDir/android" }
    google()
    mavenCentral()
}

def _glideVersion = safeExtGet("glideVersion", "4.16.0")

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.annotation:annotation:1.8.2"
    implementation "com.github.bumptech.glide:glide:${_glideVersion}"
    implementation "com.github.bumptech.glide:annotations:${_glideVersion}"
    annotationProcessor "com.github.bumptech.glide:compiler:${_glideVersion}"
    implementation "com.github.bumptech.glide:okhttp3-integration:${_glideVersion}"
}
